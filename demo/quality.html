<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WSE Voice Render Quality</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
      line-height: 1.5;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.2;
    }
    button {
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #2563eb;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
    }
    button:disabled {
      cursor: progress;
      opacity: 0.65;
    }
    #status {
      margin: 16px 0;
      color: #d1d5db;
      min-height: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid #374151;
      border-radius: 8px;
    }
    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #374151;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }
    th {
      background: #1f2937;
      color: #bfdbfe;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .pass { color: #86efac; }
    .fail { color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>WSE Voice Render Quality</h1>
    <button id="run">Run voice render</button>
    <div id="status" role="status" aria-live="polite">Idle</div>
    <table>
      <thead>
        <tr>
          <th>Instrument</th>
          <th>Peak</th>
          <th>RMS</th>
          <th>Clipped</th>
          <th>Non-finite</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </main>
  <script src="quality.js"></script>
</body>
</html>
